[databases]
p3_relay = host=postgres.railway.internal port=5432 dbname=railway

[users]
p3_relay_runtime = pool_size=24 max_user_connections=24 max_user_client_connections=30
p3_relay_migrator = pool_size=1 max_user_connections=1 max_user_client_connections=2

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
pool_mode = session
auth_type = scram-sha-256
auth_file = users.txt
admin_users =
stats_users =

client_tls_sslmode = require
client_tls_cert_file = server.crt
client_tls_key_file = server.key
client_tls_protocols = secure
; TLS 1.2 uses forward-secret AEAD suites; TLS 1.3 retains library-managed suites.
client_tls_ciphers = ECDHE+AESGCM:ECDHE+CHACHA20
server_tls_sslmode = verify-full
server_tls_ca_file = backend.crt
server_tls_protocols = secure
server_tls_ciphers = ECDHE+AESGCM:ECDHE+CHACHA20

; Two overlapping API/worker tasks use 24 connections; one migrator uses one.
max_client_conn = 32
max_db_connections = 25
max_db_client_connections = 32
default_pool_size = 24
min_pool_size = 0
reserve_pool_size = 0
; A single event is at most 256 KiB; protocol frames get bounded metadata headroom.
max_packet_size = 1048576
client_login_timeout = 5
server_connect_timeout = 5
server_login_retry = 5
query_wait_timeout = 5
query_timeout = 30
server_idle_timeout = 60
server_lifetime = 1800
client_idle_timeout = 300
idle_transaction_timeout = 30
server_reset_query = DISCARD ALL

; Authentication and pooler failures remain auditable without query or payload logging.
log_connections = 1
log_disconnections = 0
log_pooler_errors = 1
verbose = 0
